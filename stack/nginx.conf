server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream http://rag-api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;            # streaming (SSE)
        proxy_read_timeout 900s;        # CPU-only inference can be slow
        client_max_body_size 10m;
    }

    # agentic AI page (/agent.html) : /agent/api/* -> agent-api /api/*
    location /agent/api/ {
        set $agent_upstream http://agent-api:8000;
        rewrite ^/agent/api/(.*)$ /api/$1 break;
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;            # streaming (SSE)
        proxy_read_timeout 1800s;       # several slow CPU-only model calls in a row
    }

    location / {
        try_files $uri /index.html;
    }
}
