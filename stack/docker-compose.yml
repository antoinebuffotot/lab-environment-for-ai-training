# AI training stack : Ollama (LLM + embeddings) + ChromaDB + RAG API + Web chat
services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h          # keep the models in memory
      OLLAMA_MAX_LOADED_MODELS: "2"   # LLM + embedding model
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # one-shot job : pulls the models then exits
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:7b} && ollama pull ${EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma

  rag-api:
    build: ./rag-api
    container_name: rag-api
    restart: unless-stopped
    depends_on:
      - ollama
      - chroma
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      DOCS_DIR: /data/docs
      VM_FQDN: ${VM_FQDN:-localhost}
      # OpenLLMetry (Traceloop SDK) -> Dynatrace OTLP
      OPENLLMETRY_ENABLED: ${OPENLLMETRY_ENABLED:-false}
      DT_TENANT: ${DT_TENANT:-}
      DT_API_TOKEN: ${DT_API_TOKEN:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-lab-rag-api}
      # OpenLLMetry records prompts and completions in the LLM span (set to false to keep content out)
      OPENLLMETRY_TRACE_CONTENT: ${OPENLLMETRY_TRACE_CONTENT:-true}
      TRACELOOP_TELEMETRY: "false"
    volumes:
      - ./docs:/data/docs:ro

  web:
    image: nginx:alpine
    container_name: web
    restart: unless-stopped
    depends_on:
      - rag-api
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ollama_data:
  chroma_data:
