<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier IA - Agent</title>
<link rel="stylesheet" href="common.css">
<style>
  /* agent steps */
  .agent { margin: 0 0 22px; border-left: 3px solid var(--accent); padding-left: 16px; }
  .step { margin: 0 0 12px; }
  .step-h { color: var(--muted); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
  .step .stext { font-family: var(--serif); font-size: 1.02rem; line-height: 1.6; overflow-wrap: anywhere; }
  .step.thought .stext { color: var(--muted); font-style: italic; }
  .step.final .stext { font-size: 1.05rem; line-height: 1.65; }
  .tool {
    margin: 6px 0; padding: 8px 12px; border-radius: 6px; font-family: var(--ui);
    background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line); font-size: .85rem;
  }
  .tool .th { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .tool .tn { font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tool .ta { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; overflow-wrap: anywhere; }
  .tool .tr { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.5em; overflow: auto; cursor: pointer; }
  .tool .tr.open { max-height: none; }
  .tool .wait { opacity: .75; }
  .agent .err { color: var(--err); font-family: var(--ui); font-size: .95rem; }
</style>
</head>
<body>

<header class="top">
  <h1 data-i18n="title">Atelier IA</h1>
  <nav class="pages" aria-label="Pages">
    <a href="/" data-i18n="navChat">Chat</a>
    <a href="/agent.html" aria-current="page" data-i18n="navAgent">Agent</a>
  </nav>
  <div class="status" aria-live="polite">
    <span class="chip" id="st-model"><i class="dot"></i><span></span></span>
    <span class="chip off" id="st-tools"><i class="dot"></i><span></span></span>
    <span class="chip off" id="st-otel"><i class="dot"></i><span></span></span>
  </div>
  <div class="lang" id="lang" role="group" aria-label="Language"></div>
</header>

<div class="shell">
  <aside class="kb">
    <div class="tabs" role="tablist" data-i18n-aria="tabsAria" aria-label="">
      <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true" data-i18n="tabSettings">Paramètres</button>
      <button type="button" role="tab" id="tab-tools" aria-controls="panel-tools" aria-selected="false" tabindex="-1" data-i18n="tabTools">Outils</button>
      <button type="button" role="tab" id="tab-obs" aria-controls="panel-obs" aria-selected="false" tabindex="-1" data-i18n="tabObs">Observability</button>
    </div>

    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings">
      <div class="field">
        <label for="s-temp"><span data-i18n="temp">Température</span> <output id="o-temp"></output></label>
        <input type="range" id="s-temp" min="0" max="2" step="0.05">
        <p class="hint" data-i18n="tempHint"></p>
      </div>
      <div class="field">
        <label for="s-topk">Top K <output id="o-topk"></output></label>
        <input type="range" id="s-topk" min="1" max="100" step="1">
        <p class="hint" data-i18n="topkHint"></p>
      </div>
      <div class="field">
        <label for="s-topp">Top P <output id="o-topp"></output></label>
        <input type="range" id="s-topp" min="0" max="1" step="0.05">
        <p class="hint" data-i18n="toppHint"></p>
      </div>
      <div class="field">
        <label for="s-steps"><span data-i18n="steps">Étapes maximum</span> <output id="o-steps"></output></label>
        <input type="range" id="s-steps" min="1" max="8" step="1">
        <p class="hint" data-i18n="stepsHint"></p>
      </div>
      <div class="field">
        <label for="s-system" data-i18n="system">Instruction de l'agent</label>
        <textarea id="s-system" rows="9" spellcheck="false"></textarea>
        <p class="hint" data-i18n="systemHint"></p>
      </div>
      <button class="btn ghost" id="s-reset" type="button" data-i18n="reset">Rétablir les valeurs par défaut</button>
      <p class="hint" style="margin-top:10px" data-i18n="resetNote"></p>
    </section>

    <section id="panel-tools" role="tabpanel" aria-labelledby="tab-tools" hidden>
      <p class="hint" data-i18n="toolsHint"></p>
      <ul id="tools-list"></ul>
      <h3 class="mcp-h" id="mcp-head"></h3>
      <ul id="mcp-status"></ul>
    </section>

    <section id="panel-obs" role="tabpanel" aria-labelledby="tab-obs" hidden>
      <p class="hint" data-i18n="obsHint"></p>
      <p class="hint" id="obs-service"></p>
    </section>
  </aside>

  <main class="codeview" id="codeview" hidden>
    <div class="file" id="code-file">app/telemetry.py</div>
    <pre><code id="code-body"></code></pre>
  </main>

  <main class="chat" id="chatview">
    <div id="notice" class="notice" hidden></div>
    <div id="log" role="log" aria-live="polite">
      <div class="col" id="messages">
        <section id="empty">
          <h2 data-i18n="emptyTitle">Confiez une tâche à l'agent</h2>
          <p data-i18n="emptyText"></p>
          <div class="starters">
            <button type="button" data-i18n="starter1"></button>
            <button type="button" data-i18n="starter2"></button>
            <button type="button" data-i18n="starter3"></button>
          </div>
        </section>
      </div>
    </div>
    <form id="composer" autocomplete="off">
      <div class="col">
        <textarea id="q" rows="2" data-i18n-ph="placeholder" data-i18n-aria="qAria" placeholder="" aria-label=""></textarea>
        <div class="row">
          <span class="hint" style="margin:0" id="run-hint"></span>
          <button class="btn" id="send" type="submit" data-i18n="send">Envoyer</button>
        </div>
      </div>
    </form>
  </main>
</div>

<style>
  #tools-list, #mcp-status { list-style: none; margin: 0; padding: 0; }
  .mcp-h { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  #mcp-status li { padding: 5px 0; font-size: .85rem; overflow-wrap: anywhere; }
  #mcp-status li.ko { color: var(--err); }
  #mcp-status li.ok::before { content: "● "; color: var(--ok); }
  #tools-list .src { font-size: .72rem; color: var(--note-ink); background: var(--note); border: 1px solid var(--note-line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-family: var(--ui); font-weight: 600; }
  #tools-list li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
  #tools-list .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; display: block; }
  #tools-list .d { color: var(--muted); }
</style>

const t = i18n.t;

const logEl = $("log"), messages = $("messages"), qEl = $("q"), sendBtn = $("send");
let history = [], busy = false, health = null, linkDown = false, toolsInfo = [];

/* ---------- status ---------- */
function setChip(id, cls, label) { const el = $(id); el.className = "chip " + cls; el.lastElementChild.textContent = label; }
function showNotice(text) { const n = $("notice"); n.hidden = !text; n.textContent = text || ""; }
function renderStatus() {
  const h = health;
  if (!h) {
    setChip("st-model", linkDown ? "err" : "", t(linkDown ? "unreachable" : "stModelWait"));
    setChip("st-tools", "off", t("stToolsWait")); setChip("st-otel", "off", t("stOtelWait"));
    showNotice(linkDown ? t("noticeDown") : ""); $("obs-service").textContent = ""; return;
  }
  setChip("st-model", h.models_ready ? "ok" : "", t(h.models_ready ? "stModelOk" : "stModelPull", { model: h.model }));
  setChip("st-tools", "ok", t("stTools", { n: h.tools.length }));
  setChip("st-otel", h.openllmetry ? "ok" : "off", t(h.openllmetry ? "stOtelOn" : "stOtelOff") + (h.openllmetry ? " (" + h.service + ")" : ""));
  $("obs-service").textContent = t("obsService", { service: h.service });
  showNotice(h.models_ready ? "" : t("noticePull", { model: h.model }));
  renderMcp();
}
function renderMcp() {
  const m = health && health.mcp, ul = $("mcp-status");
  $("mcp-head").textContent = t("mcpHead");
  ul.innerHTML = "";
  const add = (cls, text) => { const li = document.createElement("li"); li.className = cls; li.textContent = text; ul.append(li); };
  if (!m || (!m.configured && !m.servers.length)) { add("", t("mcpNone", { file: m ? m.file : "/workspace/mcp/mcp.json" })); return; }
  if (m.error) add("ko", m.error);
  for (const s of m.servers) add(s.ok ? "ok" : "ko", s.ok ? t("mcpOk", { name: s.name, n: s.tools.length }) : t("mcpKo", { name: s.name, error: s.error }));
}
async function refreshHealth() {
  try {
    health = await (await fetch(API + "/api/health")).json(); linkDown = false; loadSettings();
    const sig = JSON.stringify(health.tools);
    if (sig !== toolsSig) { toolsSig = sig; loadTools(); }
  } catch { health = null; linkDown = true; }
  renderStatus(); updateSend();
}
function updateSend() { sendBtn.disabled = busy || !(health && health.models_ready); }

/* ---------- settings ---------- */
const FIELDS = [["temperature", "s-temp", "o-temp", 2], ["top_k", "s-topk", "o-topk", 0], ["top_p", "s-topp", "o-topp", 2], ["max_steps", "s-steps", "o-steps", 0]];
let defaults = { temperature: 0.2, top_k: 40, top_p: 0.9, max_steps: 5, system_prompt: "" };
let settings = { ...defaults }, settingsLoaded = false;
function saveSettings() { try { localStorage.setItem("ailab.agent.settings", JSON.stringify(settings)); } catch {} }
function paintSettings() {
  for (const [key, inputId, outId, digits] of FIELDS) { $(inputId).value = settings[key]; $(outId).textContent = i18n.num(settings[key], digits); }
  $("s-system").value = settings.system_prompt;
}
async function loadSettings() {
  if (settingsLoaded) return;
  try { defaults = await (await fetch(API + "/api/settings")).json(); } catch { return; }
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem("ailab.agent.settings") || "{}"); } catch {}
  settings = { ...defaults, ...stored };
  if (!settings.system_prompt) settings.system_prompt = defaults.system_prompt;
  settingsLoaded = true; paintSettings();
}
for (const [key, inputId, outId, digits] of FIELDS) {
  $(inputId).addEventListener("input", (e) => { settings[key] = Number(e.target.value); $(outId).textContent = i18n.num(settings[key], digits); saveSettings(); });
}
$("s-system").addEventListener("input", (e) => { settings.system_prompt = e.target.value; saveSettings(); });
$("s-reset").onclick = () => { settings = { ...defaults }; paintSettings(); saveSettings(); };

/* ---------- tools list ---------- */
let toolsSig = "";
async function loadTools() {
  try { toolsInfo = await (await fetch(API + "/api/tools")).json(); } catch { toolsSig = ""; return; }
  const ul = $("tools-list"); ul.innerHTML = "";
  for (const tl of toolsInfo) {
    const li = document.createElement("li");
    li.innerHTML = '<span class="n"></span><span class="d"></span>';
    li.querySelector(".n").textContent = tl.name; li.querySelector(".d").textContent = tl.description;
    if (tl.source && tl.source !== "local") { const b = document.createElement("span"); b.className = "src"; b.textContent = "MCP · " + tl.source; li.querySelector(".n").append(b); }
    ul.append(li);
  }
}

/* ---------- side panel tabs ---------- */
const tabs = [["tab-settings", "panel-settings"], ["tab-tools", "panel-tools"], ["tab-obs", "panel-obs"]];
let codeLoaded = false;
async function loadCode() {
  if (codeLoaded) return;
  $("code-body").textContent = t("obsLoading");
  try {
    const j = await (await fetch(API + "/api/observability/code")).json();
    $("code-file").textContent = j.file; $("code-body").textContent = j.code; codeLoaded = true;
  } catch { $("code-body").textContent = t("obsFail"); }
}
function selectTab(i) {
  tabs.forEach(([tab, panel], j) => { $(tab).setAttribute("aria-selected", j === i); $(tab).tabIndex = j === i ? 0 : -1; $(panel).hidden = j !== i; });
  const obs = tabs[i][0] === "tab-obs";
  $("chatview").hidden = obs; $("codeview").hidden = !obs;
  if (obs) loadCode();
  $(tabs[i][0]).focus();
}
tabs.forEach(([tab], i) => {
  $(tab).addEventListener("click", () => selectTab(i));
  $(tab).addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); selectTab((i + 1) % tabs.length); }
    if (e.key === "ArrowLeft") { e.preventDefault(); selectTab((i + tabs.length - 1) % tabs.length); }
  });
});

/* ---------- agent run ---------- */
const scrollDown = () => { logEl.scrollTop = logEl.scrollHeight; };
function addUser(text) { const d = document.createElement("div"); d.className = "msg user"; d.textContent = text; messages.append(d); scrollDown(); }
function newStep(run, n) {
  const d = document.createElement("section"); d.className = "step";
  d.innerHTML = '<p class="step-h"></p><div class="stext"></div>';
  d.querySelector(".step-h").textContent = t("stepLabel", { n });
  d.dataset.n = n; d.text = "";
  run.querySelector(".steps").append(d); return d;
}
function newToolCard(step, name, args) {
  const c = document.createElement("div"); c.className = "tool";
  c.innerHTML = '<div class="th"><span class="tn"></span><span class="ta"></span></div><p class="tr wait"></p>';
  c.querySelector(".tn").textContent = name;
  c.querySelector(".ta").textContent = JSON.stringify(args);
  const r = c.querySelector(".tr"); r.textContent = t("noResult"); r.title = t("expand"); r.onclick = () => r.classList.toggle("open");
  step.append(c); return c;
}

async function ask(task) {
  if (busy || !task.trim()) return;
  busy = true; updateSend();
  const empty = $("empty"); if (empty) empty.remove();
  addUser(task);
  const run = document.createElement("article"); run.className = "agent";
  run.innerHTML = '<div class="steps"></div><p class="thinking"></p><p class="meta"></p>';
  run.querySelector(".thinking").textContent = t("running");
  messages.append(run); scrollDown();
  const thinking = run.querySelector(".thinking"), meta = run.querySelector(".meta");
  const used = { ...settings };
  let step = null, finalText = "", errored = false, final = null, lastCard = null;

  try {
    const res = await fetch(API + "/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: task, history: history.slice(-6), system_prompt: used.system_prompt, max_steps: used.max_steps,
        temperature: used.temperature, top_k: used.top_k, top_p: used.top_p,
      }),
    });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.detail || t("error", { status: res.status })); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "message", data = "";
        for (const line of raw.split("\n")) { if (line.startsWith("event:")) ev = line.slice(6).trim(); else if (line.startsWith("data:")) data += line.slice(5).trim(); }
        if (!data) continue;
        const j = JSON.parse(data);
        if (ev === "step") { step = newStep(run, j.n); }
        else if (ev === "token" && step) { step.text += j.text; step.querySelector(".stext").innerHTML = md(step.text); }
        else if (ev === "tool_call" && step) { step.classList.add("thought"); lastCard = newToolCard(step, j.name, j.args); }
        else if (ev === "tool_result" && lastCard) {
          const r = lastCard.querySelector(".tr"); r.classList.remove("wait"); r.textContent = j.result;
        }
        else if (ev === "done") final = j;
        else if (ev === "error") { errored = true; const p = document.createElement("p"); p.className = "err"; p.textContent = j.text; run.querySelector(".steps").append(p); }
        scrollDown();
      }
    }
    // the last step without tool call is the answer
    const steps = run.querySelectorAll(".step");
    const last = steps[steps.length - 1];
    if (last && !last.querySelector(".tool")) { last.classList.add("final"); finalText = last.text; }
    if (final) meta.textContent = t("metaDone", { steps: final.steps, n: final.tokens, total: final.total_s,
      t: i18n.num(used.temperature, 2), k: used.top_k, p: i18n.num(used.top_p, 2) });
    if (!finalText && !errored) { const p = document.createElement("p"); p.textContent = t("nothing"); run.querySelector(".steps").append(p); }
  } catch (err) {
    errored = true;
    const p = document.createElement("p"); p.className = "err"; p.textContent = err.message; run.querySelector(".steps").append(p);
  }
  thinking.remove();
  if (!errored && finalText) history.push({ role: "user", content: task }, { role: "assistant", content: finalText });
  busy = false; updateSend(); qEl.focus();
}

$("composer").addEventListener("submit", (e) => { e.preventDefault(); const q = qEl.value; qEl.value = ""; ask(q); });
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
document.querySelectorAll(".starters button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));

/* ---------- language ---------- */
i18n.switcher("lang", () => { renderStatus(); renderMcp(); paintSettings(); document.querySelectorAll(".thinking").forEach((el) => { el.textContent = t("running"); }); });
i18n.apply(); renderStatus(); paintSettings();
refreshHealth();
setInterval(refreshHealth, 5000);
</script>
</body>
